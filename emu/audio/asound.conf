# ALSA config for the emulated MGU22: BMW/Harman software plays to "HarmanX:<sink name>" (the car's
# Harman audio DSP). Here every HarmanX sink - and the default device - goes to PulseAudio, which
# is WSLg's server (PULSE_SERVER) and comes out of the Windows speakers.
pcm.HarmanX {
    @args [ SINK ]
    @args.SINK { type string default "default" }
    type pulse
}
ctl.HarmanX {
    @args [ SINK ]
    @args.SINK { type string default "default" }
    type pulse
}
pcm.!default { type pulse }
ctl.!default { type pulse }
