# m3: same MGU22 iDrive 8.5 firmware as xdrive, BMW M theme, M3 (G80 LCI) vehicle pack.
NAME="m3"
DESC="iDrive 8.5 - BMW M theme - G80 LCI M3"
BRAND=bmwm
VARIANT=G80LCI
# M brand + 14.9" curved CID (what a G80 LCI has). With default coding the HMI picks its project
# config section from data/rw/fallback_config_section.
CONFIG_SECTION=config.bmwm_id8_display14_9_2880x960
SCREEN_W=2880
SCREEN_H=960
